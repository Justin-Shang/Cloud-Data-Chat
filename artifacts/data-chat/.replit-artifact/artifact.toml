kind = "web"
previewPath = "/"
title = "数据库对话助手"
version = "1.0.0"
id = "artifacts/data-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25592

[services.development]
run = "pnpm --filter @workspace/data-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/data-chat", "run", "build" ]
publicDir = "artifacts/data-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25592"
BASE_PATH = "/"
